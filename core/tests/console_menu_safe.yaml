name: console_menu_safe
# Item 5 (found while testing): the unmodified game raises FATAL ERROR
# "Console font texture not loaded" if its console is opened before a level
# has loaded (font is registered with the level). With FDNYCore every player
# has the console, so opening it at the main menu must be refused safely:
# no crash, console stays closed, game input not left blocked.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
record: true
steps:
  - wait_s: 5
  - click: [320, 240]
  - wait_s: 3
  - type: "`"
  - wait_s: 1.5
  - assert_mem: {name: console.state, equals: 0}
  - assert_mem: {name: controls.block_input, equals: 0}
  - assert_log: {contains: "console> console: not available until a level has loaded"}
  - key: tab
  - wait_s: 1.5
  - assert_mem: {name: console.state, equals: 0}
  - assert_screen_nonblack: menu_after
  # the menu still responds: "game" opens the career list, then the console works in a level
  - run_setup: load_training_from_menu
  - type: "`"
  - wait_s: 0.5
  - assert_mem: {name: console.state, equals: 2}
  - type: "echo in-level-console-ok"
  - key: enter
  - wait_s: 0.5
  - assert_log: {contains: "console> in-level-console-ok"}
  - screenshot: in_level_console
expect:
  no_crash: true
  log_errors: 0

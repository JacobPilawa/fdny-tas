name: probe_trigger_hud_clip2
# Not in the suite: owner report 2026-10-23, round 2. The owner was crouched (state 3) at
# -921.7 766 247 on oil_rig_A; their exit box covered the lower right quarter. Crouch,
# then look around yaw 45 with the warp HUD on and off.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap oil_rig_A"
  - wait_s: 45
  - console: "fd_triggers 1"
  - console: "fd_hud_warp 1"
  - console: "fd_hud_player 1"
  - console: "fd_dbg_setpos -921.7 766 247 45"
  - wait_s: 2
  - focus: {}
  - key: {key: c, hold: 0.3}
  - wait_s: 1.5
  - screenshot: crouch_y045
  - console: "fd_dbg_setpos -921.7 766 247 30"
  - wait_s: 1
  - screenshot: crouch_y030
  - console: "fd_dbg_setpos -921.7 766 247 60"
  - wait_s: 1
  - screenshot: crouch_y060
  - console: "fd_hud_warp 0"
  - wait_s: 1
  - screenshot: crouch_y060_nohud
  - console: "fd_dbg_setpos -921.7 766 247 45"
  - wait_s: 1
  - screenshot: crouch_y045_nohud
  - console: "fd_triggers_xray 1"
  - wait_s: 1
  - screenshot: crouch_y045_xray
  - pipe: "triggers"
  - console: "fd_triggers_list"
expect:
  no_crash: true
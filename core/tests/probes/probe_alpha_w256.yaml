name: probe_alpha_w256
# Alpha spike, one texture variant per run (see probe_alpha.yaml).
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: build/probes/zz_alphaprobe.asi, dst: zz_alphaprobe.asi}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "fd_zzp_0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: base_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: base_1}
  - screenshot: base
  - console: "fd_zzp_6_128_0_1_7_256"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: tex_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: tex_1}
  - screenshot: tex
  - console: "fd_zzp_0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: end_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: end_1}
  - screenshot: end
expect:
  no_crash: true
  log_errors: 0

name: probe_split_win_training
# Not in the suite: autosplitter spike. training won through the game's own win routine
# (dev key F8 = DBG_WIN_LEVEL: victim counters + PlayerRescueEnt::UpdateZonesAndWin);
# splitprobe.py beside it logs what the ASL would see.
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap training"
  - wait_s: 40
  - focus: {}
  - key: {key: f8, hold: 0.2}
  - wait_s: 15
  - screenshot: end
expect:
  no_crash: true
name: probe_trigger_sweep
# Not in the suite: where the bank's rescue zone / exit boxes are from the spawn
# (screenshots every 300 px of mouse turn, x-ray), to aim the triggers test's screenshots.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap bank"
  - wait_s: 40
  - console: "fd_triggers 1"
  - console: "fd_triggers_xray 1"
  - console: "fd_triggers_list"
  - wait_s: 1
  - sample_pos: start
  - screenshot: s0
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s1
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s2
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s3
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s4
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s5
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s6
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s7
  - mouse_rel: [300, 0]
  - wait_s: 0.7
  - screenshot: s8
  - pipe: triggers
expect:
  no_crash: true
  log_errors: 0

name: probe_split_chain
# Not in the suite: autosplitter spike (owner 2026-10-23). Genuine stage exits, with
# probes/splitprobe.py running beside it in `force` mode (it opens each level's exit the
# game's way, see there). Each stage: wait for the probe's input, then step into the exit
# trigger (boxes from probe_split_listexits): its touch runs the map's own exit verb
# (finalexitloadmap <next> on stages, finalexit on the last). Oil rig A -> B -> C -> D,
# boat A -> B -> end, subway A -> B.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap oil_rig_A"
  - wait_s: 30
  - console: "fd_dbg_setpos -754 800 416 45"
  - wait_s: 40
  - screenshot: oil_b
  - console: "fd_dbg_setpos 476 800 276 0"
  - wait_s: 40
  - screenshot: oil_c
  - console: "fd_dbg_setpos 1164 780 -1474 0"
  - wait_s: 40
  - screenshot: oil_d
  - console: "loadmap boat_a"
  - wait_s: 30
  - console: "fd_dbg_setpos 914 -150 8680 0"
  - wait_s: 40
  - screenshot: boat_b
  - console: "fd_dbg_setpos -1195 500 3375 0"
  - wait_s: 25
  - screenshot: boat_end
  - console: "loadmap subway_a"
  - wait_s: 30
  - console: "fd_dbg_setpos 2215 -475 -5114 0"
  - wait_s: 40
  - screenshot: subway_b
expect:
  no_crash: true
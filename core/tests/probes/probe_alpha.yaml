name: probe_alpha
# Alpha-panel research spike (not in the suite): zz_alphaprobe.asi draws per phase;
# frame counters (stats begin/end) over 6 s + a screenshot per phase.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: build/probes/zz_alphaprobe.asi, dst: zz_alphaprobe.asi}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "fd_zzp_0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: base_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: base_1}
  - screenshot: base
  - console: "fd_zzp_1_255_0_1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: opaque_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: opaque_1}
  - screenshot: opaque
  - console: "fd_zzp_1_128_0_1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: a128_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: a128_1}
  - screenshot: a128
  - console: "fd_zzp_1_64_0_1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: a64_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: a64_1}
  - screenshot: a64
  - console: "fd_zzp_1_128_1_1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: z0_0}
  - wait_s: 6

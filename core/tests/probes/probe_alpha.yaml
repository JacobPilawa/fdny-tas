  - wait_s: 2
  - sample_pipe: {cmd: stats, as: noflush_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: noflush_1}
  - screenshot: noflush
  - console: "fd_zzp_3_128_0_1"
  - wait_s: 2

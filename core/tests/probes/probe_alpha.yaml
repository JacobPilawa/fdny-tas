  - wait_s: 2
  - sample_pipe: {cmd: stats, as: cost400_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: cost400_1}
  - screenshot: cost400
  - console: "fd_zzp_6_128_0_1_7"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: tex4444_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: tex4444_1}
  - screenshot: tex4444

name: probe_pause_console
# Not in the suite: why did a console line typed while paused not run (pause_service run
# fc3: the text stayed in the open console, no level load)? Console::OnKeyDown 0x00428C50
# runs Enter synchronously from WM_KEYDOWN and ignores it in console state 1. Compare an
# FDNYCore line and a game line, running and paused, and read console.state each time.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - sample_mem: {name: console.state, as: cs_running_after, append: true}
  - assert_log: {contains: "cmd: fd_watermark 0"}
  - pipe: "pause on"
  - wait_pipe: {cmd: pause, key: active, equals: 1, timeout: 3}
  - sample_mem: {name: console.state, as: cs_paused_before, append: true}
  - console: "fd_juggle 1"
  - sample_mem: {name: console.state, as: cs_paused_after, append: true}
  - wait_s: 1
  - screenshot: paused_after_fd_line
  - assert_log: {contains: "cmd: fd_juggle 1"}
  - console: "echo paused-echo"
  - wait_s: 1
  - sample_mem: {name: console.state, as: cs_paused_after2, append: true}
  - screenshot: paused_after_echo
  - assert_log: {contains: "paused-echo"}
  - pipe: "pause off"
  - wait_pipe: {cmd: pause, key: active, equals: 0, timeout: 3}
  - wait_s: 1
  - sample_mem: {name: console.state, as: cs_resumed, append: true}
  - screenshot: resumed
expect:
  no_crash: true

name: probe_split_listexits
# Not in the suite: autosplitter spike. The trigger list (exit boxes, their scripts' targets)
# of every staged map, for the stage-exit runs.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap boat_a"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap boat_b"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap subway_a"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap subway_b"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap oil_rig_B"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap oil_rig_C"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap oil_rig_D"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
expect:
  no_crash: true
name: probe_firejuggle
# Not in the suite: holds bank open (RescueBot off) while probes/firejuggle_probe.py
# drives the fire-juggling experiment from outside (pymem). Start the driver first,
# then this test. Evidence: evidence/fire_juggling/.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "fd_rescuebot 0"
  - console: "loadmap bank"
  - wait_s: 40
  - screenshot: bank
  - wait_s: 150
  - screenshot: end
expect:
  no_crash: true

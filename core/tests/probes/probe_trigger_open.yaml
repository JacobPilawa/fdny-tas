name: probe_trigger_open
# Not in the suite: can `runrescuebot` (the game's script verb; the bot claims a victim,
# raising the claimed count UpdateZonesAndWin subtracts) open the bank's exit? Samples the
# state snapshot and the triggers pipe after each call.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap bank"
  - wait_s: 40
  - console: "fd_triggers 1"
  - pipe: snapshot
  - pipe: triggers
  - repeat:
      times: 8
      steps:
        - console: "runrescuebot"
        - wait_s: 9
        - pipe: snapshot
        - pipe: triggers
expect:
  no_crash: true
  log_errors: 0

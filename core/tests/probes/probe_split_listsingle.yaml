name: probe_split_listsingle
# Not in the suite: autosplitter spike. Trigger lists of the single-stage levels (exit boxes).
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "fd_triggers_list"
  - console: "loadmap bank"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap bar_r"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap gas_r"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
  - console: "loadmap mbase"
  - wait_s: 45
  - console: "fd_triggers_list"
  - wait_s: 2
expect:
  no_crash: true
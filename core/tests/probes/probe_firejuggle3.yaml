name: probe_firejuggle3
# Not in the suite: round 3 of the fire-juggling spike (liftable catch; the 0x7530
# cool-down source). Installs zz_juggleprobe.asi and holds the game open while
# probes/firejuggle_probe3.py drives it, including its own `loadmap`s. Start the
# driver first.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: build/probes/zz_juggleprobe.asi, dst: zz_juggleprobe.asi}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "fd_rescuebot 0"
  - console: "loadmap bank"
  - wait_s: 40
  - wait_s: 900
  - screenshot: end
expect:
  no_crash: true

name: probe_split_oilrig
# Not in the suite: autosplitter spike (owner 2026-10-23). A genuine staged-map exit on
# oil_rig_A: the game's own `runrescuebot` claims victims until UpdateZonesAndWin opens the
# exit, then the player is moved into the exit trigger (final_exit
# (-812 740 356)-(-696 972 476)), whose touch runs `tell player (finalexitloadmap
# oil_rig_b)`. probes/splitprobe.py runs beside it (start it first) and logs every change.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "fd_triggers 1"
  - console: "loadmap oil_rig_A"
  - wait_s: 45
  - repeat:
      times: 8
      steps:
        - console: "runrescuebot"
        - wait_s: 8
  - assert_log: {contains: "triggers: exit"}
  - screenshot: exit_open
  - console: "fd_dbg_setpos -754 800 416 45"
  - wait_s: 60
  - screenshot: after_exit
  - console: "fd_triggers_list"
expect:
  no_crash: true

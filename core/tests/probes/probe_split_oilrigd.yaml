name: probe_split_oilrigd
# Not in the suite: autosplitter spike. oil_rig_D (no exit trigger: the lifeboat rescue zone
# ends it) won through the game's win routine (F8).
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap oil_rig_D"
  - wait_s: 40
  - focus: {}
  - key: {key: f8, hold: 0.2}
  - wait_s: 15
  - screenshot: end
expect:
  no_crash: true
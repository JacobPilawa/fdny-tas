name: probe_split_single
# Not in the suite: autosplitter spike. How single-stage levels end, with
# probes/splitprobe.py in `force` mode beside it (it opens each level's exit the game's
# way). bank: then step into its exit; bar_r / gas_r / mbase have no exit trigger (all
# victims accounted for ends them); training: forced at the start of the run.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - wait_s: 25
  - screenshot: training_after_force
  - console: "loadmap bank"
  - wait_s: 30
  - console: "fd_dbg_setpos -680 0 1361 0"
  - wait_s: 15
  - screenshot: bank_end
  - console: "loadmap bar_r"
  - wait_s: 40
  - screenshot: bar_end
  - console: "loadmap gas_r"
  - wait_s: 40
  - screenshot: gas_end
  - console: "loadmap mbase"
  - wait_s: 40
  - screenshot: mbase_end
expect:
  no_crash: true
name: probe_trigger_depth2
# Not in the suite (historical: fd_dbg_box_mode was removed when mode 4 became the real path, D39):
# the world-box draw path experiment (fd_dbg_box_mode 0-4) at the owner's
# second spot (oil_rig_A, -712.9 838.4 -927.8, crouched), views yaw 0 and 330.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "loadmap oil_rig_A"
  - wait_s: 45
  - console: "fd_triggers 1"
  - console: "fd_dbg_setpos -712.9 838.4 -927.8 0"
  - wait_s: 2
  - focus: {}
  - key: {key: c, hold: 0.3}
  - wait_s: 1.5
  - screenshot: m0_y000
  - screenshot: m0_y000_again
  - console: "fd_dbg_box_mode 1"
  - wait_s: 1
  - screenshot: m1_y000
  - console: "fd_dbg_box_mode 2"
  - wait_s: 1
  - screenshot: m2_y000
  - console: "fd_dbg_setpos -712.9 838.4 -927.8 330"
  - wait_s: 1
  - screenshot: m2_y330
  - console: "fd_dbg_box_mode 1"
  - wait_s: 1
  - screenshot: m1_y330
  - console: "fd_dbg_box_mode 0"
  - wait_s: 1
  - screenshot: m0_y330
  - console: "fd_dbg_box_mode 4"
  - wait_s: 1
  - screenshot: m4_y330
  - console: "fd_dbg_setpos -712.9 838.4 -927.8 0"
  - wait_s: 1
  - screenshot: m4_y000
expect:
  no_crash: true
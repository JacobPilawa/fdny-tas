name: glitch_box_cost
# Item 11d: the boxes must not cost frame rate. Drawn in-frame with
# geEngine_Printf they cut simulated ticks from ~346 to 84 per 6 s; drawn as one
# in-frame bitmap (textdraw) they keep ~346.
# D46 (owner 2026-10-24): checked without depending on the display's refresh rate, which
# caps the game (57 fps on the VM console, 34 on a 32 Hz remote display):
#  - the game-thread box build (glitch draw_us_avg: CPU time only) under 1 ms;
#    the HUD layer's time per frame (textdraw_cost) is recorded, not asserted: it includes
#    geEngine_FlushPipeline, which can wait on the GPU, so it depends on the display too;
#  - ticks with the boxes shown >= 0.9 x ticks with them hidden (B), the same 6 s windows
#    back to back, so the refresh rate cancels out (the Printf boxes were 0.24);
#  - a floor of 60 ticks per window: the game is running at all.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/data/fdcore_hud_glitch.cfg, dst: FDNYCore.cfg}
setup: load_training
steps:
  - wait_s: 3
  - sample_pipe: {cmd: glitch, as: shown0}
  - sample_pipe: {cmd: textdraw_cost, as: cost0}
  - wait_s: 6
  - sample_pipe: {cmd: glitch, as: shown1}
  - sample_pipe: {cmd: textdraw_cost, as: cost1}
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 0}
  - assert_pipe_stat: {cmd: glitch, key: tick, min: 60, since: shown0}
  - assert_pipe_stat: {cmd: glitch, key: draw_us_avg, max: 1000}
  - screenshot: box_shown
  - key: {key: b, hold: 0.2}
  - sample_pipe: {cmd: glitch, as: hidden0}
  - wait_s: 6
  - sample_pipe: {cmd: glitch, as: hidden1}
  - assert_pipe_stat: {cmd: glitch, key: tick, min: 60, since: hidden0}
  - assert_sample_ratio: {num: [shown0, shown1, tick], den: [hidden0, hidden1, tick], min: 0.9}
  - key: {key: b, hold: 0.2}
  - sample_pipe: {cmd: glitch, as: cost}   # draw_us_avg = game-thread box cost
expect:
  no_crash: true
  log_errors: 0

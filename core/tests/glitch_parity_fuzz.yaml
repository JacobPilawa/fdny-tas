name: glitch_parity_fuzz
# Items 11b-11d: the live parity test rarely sees warp-capable hits or warps,
# so this one feeds a seeded synthetic .glitchrec stream (glitch_fuzz.py:
# capable hits, warps, every iteration outcome, Genesis callers relocated or
# not, crouchbug edges, .x5 rounding edges, real maps + lined-up spots, map
# switches, F12 clears) through the core's analysis offline (Debug pipe) and
# through the original overlay classes. The collision log AND the per-frame
# box text (Overlay.build()) must be identical.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: null, dst: FDNYCore.glitchbox}
env:
  FDNYCORE_TEST_GLITCHBOX: "1"
setup: load_training
steps:
  - glitch_replay_fuzz: {seed: 1, frames: 800, sessions: 3}
expect:
  no_crash: true
  log_errors: 0
  glitch_parity: true
  glitch_min_lines: 1000
  glitch_box: true
  glitch_box_min_frames: 2400

name: text_alpha
# 0.15.1: text opacity on translucent panels (fd_text_fg_alpha). Solid text (255) vs 96
# on the same frame region.
# Suite review (2026-10-24): this used to take the screenshots and assert nothing about
# them. Now the shots are taken with the world paused (Debug pipe `pause on`: the panels
# keep drawing, the sky and clock stop), and inside the player HUD panel, 255 vs 96 must
# differ clearly while 255 vs 255-again stays at the noise floor.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/data/fdcore_panels.cfg, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - wait_s: 2
  - assert_log: {contains: "textdraw: hud_player: 168x58 at 8,52 (view 640x480), translucent"}
  - pipe: "pause on"
  - wait_pipe: {cmd: pause, key: active, equals: 1, timeout: 3}
  - wait_s: 1
  - screenshot: fg255
  - console: "fd_text_fg_alpha 96"
  - wait_s: 2
  - assert_log: {contains: "fd_text_fg_alpha 96"}
  - screenshot: fg96
  - console: "fd_text_fg_alpha 255"
  - wait_s: 2
  - screenshot: fg255_again
  - pipe: "pause off"
  # the player HUD panel (168x58 at 8,52 in the 640x480 view)
  - assert_screen_diff: {a: fg255, b: fg96, box: [0.0125, 0.1083, 0.275, 0.2292], min: 2}   # measured 4.56
  - assert_screen_diff: {a: fg255, b: fg255_again, box: [0.0125, 0.1083, 0.275, 0.2292], max: 0.5}   # measured 0.00
expect:
  no_crash: true
  log_errors: 0

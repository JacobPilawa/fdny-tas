name: text_alpha
# 0.15.1: text opacity on translucent panels (fd_text_fg_alpha). Solid text (255) vs
# 96 on the same frame region; the screenshots are compared in the evidence.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/data/fdcore_panels.cfg, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - wait_s: 2
  - screenshot: fg255
  - console: "fd_text_fg_alpha 96"
  - wait_s: 2
  - assert_log: {contains: "fd_text_fg_alpha 96"}
  - screenshot: fg96
  - console: "fd_text_fg_alpha 255"
  - wait_s: 2
  - screenshot: fg255_again
expect:
  no_crash: true
  log_errors: 0
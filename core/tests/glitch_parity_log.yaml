name: glitch_parity_log
# Item 11b: the collision log FDNYCore writes live is IDENTICAL, line for line,
# to what the original tools/collision_overlay classes (Model / FrameAnalyzer /
# TextLog / GameSource._classify) produce from the same raw record stream.
# Training, then bank (roaming victims, fires = non-player writers), walking,
# turning, crouching, two hook sessions (off/on).
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/data/fdcore_hud_glitch.cfg, dst: FDNYCore.cfg}
  - {src: null, dst: FDNYCore.glitchrec}
setup: load_training
record: true
steps:
  - assert_log: {contains: "glitch: hooks installed"}
  - key: {key: w, hold: 2.0}
  - key: {key: c, hold: 0.3}
  - key: {key: w, hold: 1.5}
  - key: {key: c, hold: 0.3}
  - console: "loadmap bank"
  - wait_s: 40
  - repeat:
      times: 6
      steps:
        - key: {key: w, hold: 2.5}
        - mouse_rel: [250, 0]
        - key: {key: a, hold: 1.0}
        - key: {key: w, hold: 1.5}
        - mouse_rel: [-400, 0]
        - key: {key: d, hold: 1.0}
  - console: "fd_hud_glitch 0"
  - key: {key: w, hold: 1.0}
  - console: "fd_hud_glitch 1"
  - repeat:
      times: 3
      steps:
        - key: {key: w, hold: 2.0}
        - mouse_rel: [300, 0]
  - sample_pipe: {cmd: glitch, as: glitch_stats}   # analysis cost per frame (11c: + warp window)
expect:
  no_crash: true
  log_errors: 0
  glitch_parity: true
  glitch_min_lines: 12

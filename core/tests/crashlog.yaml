name: crashlog
# The crash reporter (crashlog.cpp, installed in DllMain): an access violation is
# logged with the faulting module+offset, the registers, and the code addresses on the
# stack, so a player's crash can be traced to a function without a debugger. The
# fault here is one Windows catches itself (Debug hook fd_dbg_fault: IsBadReadPtr on
# 0x10), so the handler reports it and the game carries on.
# Added by the suite review (2026-10-24): nothing tested the reporter before.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_dbg_fault"
  - wait_s: 1
  - assert_log: {contains: "crashlog: test fault (fd_dbg_fault)"}
  - assert_log: {contains: "crashlog: exception c0000005 at"}
  - assert_log: {contains: "; data 00000010"}
  - assert_log: {contains: "crashlog: eax="}
  - assert_log: {contains: "(FDNYCore.asi+"}   # the stack walk reaches the core's own frame
  - assert_log: {contains: "crashlog: test fault handled, game continues (IsBadReadPtr=1)"}
  - assert_mem: {name: game.map_name, equals: training}
  - key: {key: w, hold: 1.0}
  - assert_screen_nonblack: after_fault
expect:
  no_crash: true
  log_errors: 0

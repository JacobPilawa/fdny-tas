name: skip_intro
# fd_skip_intro (found while hardening item 9: the intro movies intermittently
# stall on the VM). With the test-only environment switch OFF, a player's
# FDNYCore.cfg line `fd_skip_intro "1"` skips the Activision/Mekada movies at
# startup (patch applied in DllMain, before WinMain plays them), and the game
# reaches its menus and a level normally.
env: {FDNYCORE_TEST_SKIP_INTRO: "0"}
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/data/fdcore_skip_intro.cfg, dst: FDNYCore.cfg}
setup: load_training
record: true
steps:
  - assert_log: {contains: "patches: intro movies skipped (fd_skip_intro)"}
  - assert_mem: {name: game.map_name, equals: training}
  - type: "`"
  - type: "cvarlist"
  - key: enter
  - wait_s: 0.5
  - type: "`"
  - assert_log: {contains: "console> fd_skip_intro \"1\""}
expect:
  no_crash: true
  log_errors: 0

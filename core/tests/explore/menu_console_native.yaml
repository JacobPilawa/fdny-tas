name: explore_menu_console_native
# Exploration: does the UNMODIFIED game (no core, ImADeveloper = true) also
# fatal-error when its console is opened at the main menu?
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
record: true
steps:
  - wait_s: 5
  - click: [320, 240]
  - wait_s: 3
  - screenshot: 01_menu
  - type: "`"
  - wait_s: 2
  - screenshot: 02_after_backtick
expect:
  no_crash: true

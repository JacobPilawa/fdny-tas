name: explore_movement
# Exploration (not part of the suite): which keys move the player?
setup: load_training
record: true
steps:
  - sample_mem: {name: player.pos_x, as: x0}
  - sample_mem: {name: player.pos_z, as: z0}
  - sample_mem: {name: player.state, as: state0}
  - key: {key: w, hold: 2.0}
  - wait_s: 0.5
  - sample_mem: {name: player.pos_x, as: x_after_w}
  - sample_mem: {name: player.pos_z, as: z_after_w}
  - key: {key: up, hold: 2.0}
  - wait_s: 0.5
  - sample_mem: {name: player.pos_x, as: x_after_up}
  - sample_mem: {name: player.pos_z, as: z_after_up}
  - mouse_rel: [300, 0]
  - wait_s: 0.5
  - screenshot: after_turn
  - key: {key: w, hold: 1.0}
  - wait_s: 0.5
  - sample_mem: {name: player.pos_x, as: x_after_turn_w}
  - sample_mem: {name: player.pos_z, as: z_after_turn_w}
  - key: {key: lctrl, hold: 1.0}
  - sample_mem: {name: player.state, as: state_ctrl}
  - key: {key: c, hold: 1.0}
  - sample_mem: {name: player.state, as: state_c}
expect:
  no_crash: true
  log_errors: 0

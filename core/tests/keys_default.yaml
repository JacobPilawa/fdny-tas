name: keys_default
# Owner request 2026-10-22 (D37): every feature has a default letter key, no F keys.
# Presses each key in a level (game focused, console closed) and checks its effect:
# J fd_juggle, H fd_hud_player, G fd_hud_warp (the warp HUD), then B / Z its hide /
# freeze hotkeys, T trigger boxes (off -> on -> on + x-ray -> off), Y fd_triggers_all,
# K / L teleporter save / load,
# P pause (free camera; tests/freecam.yaml covers it in full). Practice-only keys are
# refused under fd_profile run. The `toggle <var>` builtin is what the toggle binds run.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - console: "fd_watermark 0"
  - console: "bindlist"
  - assert_log: {contains: "toggle fd_juggle"}
  - focus: {}
  - wait_s: 1
  # J: fire-juggling arrow
  - key: {key: j, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "bind: j -> toggle fd_juggle"}
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 1}
  - key: {key: j, hold: 0.1}
  - wait_s: 0.5
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 0}
  # H: player HUD
  - key: {key: h, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> fd_hud_player 1"}
  - screenshot: hud_on
  - key: {key: h, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> fd_hud_player 0"}
  # G: collision HUD, then its own hotkeys B (hide) and Z (freeze)
  - key: {key: g, hold: 0.1}
  - wait_s: 1
  - assert_log: {contains: "console> fd_hud_warp 1"}
  - assert_log: {contains: "glitch: hooks installed"}
  - key: {key: b, hold: 0.2}
  - wait_s: 0.3
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 1}
  - key: {key: b, hold: 0.2}
  - wait_s: 0.3
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 0}
  - key: {key: z, hold: 0.2}
  - wait_s: 0.3
  - assert_pipe_stat: {cmd: glitch_box, key: frozen, equals: 1}
  - key: {key: z, hold: 0.2}
  - wait_s: 0.3
  - assert_pipe_stat: {cmd: glitch_box, key: frozen, equals: 0}
  # G off and on again always shows the boxes, even after a B hide (owner 2026-10-22)
  - key: {key: b, hold: 0.2}
  - wait_s: 0.3
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 1}
  - key: {key: g, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> fd_hud_warp 0"}
  - key: {key: g, hold: 0.1}
  - wait_s: 1
  - assert_pipe_stat: {cmd: glitch_box, key: hidden, equals: 0}
  - key: {key: g, hold: 0.1}
  - wait_s: 0.5
  # T cycles off -> on -> on + x-ray -> off; Y every trigger
  - key: {key: t, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "bind: t -> fd_triggers_toggle"}
  - assert_log: {contains: "console> trigger boxes: on"}
  - key: {key: y, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> fd_triggers_all 1"}
  - key: {key: t, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> trigger boxes: on, x-ray"}
  - screenshot: triggers_all_xray
  - key: {key: y, hold: 0.1}
  - key: {key: t, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "console> trigger boxes: off"}
  # K / L: teleporter save, walk away, load
  - key: {key: k, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "tp: saved"}
  - sample_mem: {name: player.pos_x, as: tp_x}
  - sample_mem: {name: player.pos_z, as: tp_z}
  - key: {key: w, hold: 1.5}
  - assert_moved: {x: tp_x, z: tp_z, min: 50}
  - key: {key: l, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "tp: loaded"}
  - assert_same_pos: {x: tp_x, z: tp_z, tolerance: 1}
  # P: pause and resume
  - key: {key: p, hold: 0.1}
  - wait_pipe: {cmd: pause, key: active, equals: 1, timeout: 3}
  - key: {key: p, hold: 0.1}
  - wait_pipe: {cmd: pause, key: active, equals: 0, timeout: 3}
  # FDNYCore.cfg holds only changes: the variables set above, not the default binds
  # (owner 2026-10-22: every default bind was written out); a changed default is written
  - console: "fd_writeconfig"
  - assert_file: {path: FDNYCore.cfg, absent: "bind j"}
  - assert_file: {path: FDNYCore.cfg, absent: "bind p"}
  - console: 'bind j "toggle fd_hud_player"'
  - assert_file: {path: FDNYCore.cfg, contains: "bind j \"toggle fd_hud_player\""}
  - console: 'bind j "toggle fd_juggle"'
  - assert_file: {path: FDNYCore.cfg, absent: "bind j"}
  - console: "unbind y"
  - assert_file: {path: FDNYCore.cfg, contains: "unbind y"}
  # practice-only keys are refused in run
  - console: "fd_profile run"
  - wait_s: 1
  - key: {key: j, hold: 0.1}
  - wait_s: 0.5
  - assert_log: {contains: "profile: refused fd_juggle"}
  - assert_pipe_stat: {cmd: juggle, key: enabled, equals: 0}
  - console: "fd_profile practice"
expect:
  no_crash: true
  log_errors: 0

name: fov_parity_reference
# Item 6 parity baseline: the ORIGINAL FOV fix with the owner's reference ini
# (640x480, FOVFactor 1.4), FDNYCore told to leave the FOV alone (fd_fov -1).
# The camera FOV in memory is the value FDNYCore's default must reproduce.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: tests/data/fovfix_reference_640x480_f14.ini, dst: FDNYFirefighterAmericanHeroFOVFix.ini}
  - {src: tests/data/fdcore_fov_off.cfg, dst: FDNYCore.cfg}
setup: load_training
record: true
steps:
  - assert_log: {contains: "fd_fov"}
  - assert_mem: {name: camera.fov, equals: 2.002, tolerance: 0.0005}
  - screenshot: original_fix
expect:
  no_crash: true
  log_errors: 0

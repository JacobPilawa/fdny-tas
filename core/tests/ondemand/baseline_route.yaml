name: baseline_route
# Item 1(c) "behaves the same": a scripted ~2-minute route in Training, run with the
# Release core (what players get), then twice more with the core removed, back to back on
# the same display; harness/compare_runs.py's checks must all pass (state at every lap,
# module bases, the 12 autosplitter chains, median frame rate within 10%, lap positions
# within the baselines' own spread, no ERROR lines). Before the suite review (2026-10-24)
# the suite only ran the core run and asserted it finished; the comparison was by hand.
core: Release
pre_files:
  # Same conditions as the item-1 baselines (base_a/base_b): ImADeveloper on,
  # which also skips the intro movies (they can stall on the VM) -- applies to
  # no-core runs, which no FDNYCore setting can affect.
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
setup: load_training
record: true
steps:
  - sample_mem: {name: game.state, as: state_start}
  - sample_mem: {name: game.map_name, as: map_start}
  - sample_addr: [game.state, game.map_name, victims.total, victims.rescued,
                  split.bank_end_sound, split.bar_end_sound, split.gas_end_sound,
                  split.mbase_end_sound, split.training_end_sound, split.boat_end_sound,
                  split.oilrig_end_sound, split.subway_end_sound]
  - sample_pos: s00
  - repeat:
      times: 10          # 10 x ~11.5 s of input + the setup's ~33 s = well over 2 minutes in game
      steps:
        - key: {key: w, hold: 2.0}
        - key: space
        - wait_s: 1.0
        - mouse_rel: [300, 0]
        - key: {key: w, hold: 1.5}
        - key: {key: c, hold: 1.0}
        - mouse_rel: [-300, 0]
        - key: {key: s, hold: 2.0}
        - key: {key: a, hold: 1.0}
        - key: {key: d, hold: 1.0}
        - wait_s: 1.0
        - sample_mem: {name: player.pos_x, as: lap_x, append: true}
        - sample_mem: {name: player.pos_y, as: lap_y, append: true}
        - sample_mem: {name: player.pos_z, as: lap_z, append: true}
        - sample_mem: {name: clock.fps, as: fps, append: true}
        - sample_mem: {name: clock.dt, as: dt, append: true}
        - sample_mem: {name: game.state, as: lap_state, append: true}
  - sample_pos: s10
  - screenshot: route_end
  - assert_mem: {name: game.state, equals: 1}
  - assert_mem: {name: game.map_name, equals: training}
  - sample_mem: {name: victims.total, as: victims_total}
  - sample_mem: {name: victims.rescued, as: victims_rescued}
expect:
  no_crash: true
  log_errors: 0
  baseline_equivalent: true

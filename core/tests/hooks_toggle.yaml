name: hooks_toggle
# Item 3: the frame hooks toggle off/on at runtime 50x while the game renders
# a level, without a crash; afterwards they still fire once per frame, and
# while off they don't fire at all. Debug core (test pipe).
setup: load_training
record: true
steps:
  - toggle_hooks: {group: frame, times: 50, gap_s: 0.05}
  - assert_frame_hooks: {seconds: 5, tolerance: 2}
  - assert_hooks_idle: {group: frame, seconds: 2}
  - assert_frame_hooks: {seconds: 3, tolerance: 2}
  - assert_screen_nonblack: after_toggles
expect:
  no_crash: true
  log_errors: 0

name: window_alttab
# Item 7: with alttabfix.asi removed, FDNYCore's window module gives the same
# behaviour as alttabfix (window_parity_reference runs the identical script
# against the original): five scripted alt-tab cycles; while away the mouse
# is free, when back it is held at the game window centre, the game keeps
# rendering, no crash, and the player can still move afterwards.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: alttabfix.asi}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: true
steps:
  - assert_log: {contains: "window: cursor warp at"}
  - wait_s: 0.5
  - assert_cursor: {window_centre: true, tolerance: 1}
  - run_setup: alttab_cycles
  - sample_mem: {name: player.pos_x, as: x0}
  - sample_mem: {name: player.pos_z, as: z0}
  - key: {key: w, hold: 1.5}
  - assert_moved: {x: x0, z: z0, min: 20}
  - screenshot: after_cycles
expect:
  no_crash: true
  log_errors: 0

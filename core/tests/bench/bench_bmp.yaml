name: bench_bmp
# In-frame text investigation: our own GDI-rendered bitmap blitted once per frame after
# geEngine_FlushPipeline; upload interval / format / colour key. Debug fd_bench_bmp.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: true
steps:
  - console: "fd_watermark 0"
  - console: "fd_bench_bmp 0 0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: base_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: base_1}
  - screenshot: base
  - console: "fd_bench_bmp 400 346 13 1 1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: x1_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: x1_1}
  - screenshot: x1
  - console: "fd_bench_bmp 400 346 5 1 1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: r1_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: r1_1}
  - screenshot: r1
  - console: "fd_bench_bmp 400 346 13 5 1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: x5_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: x5_1}
  - screenshot: x5
  - console: "fd_bench_bmp 400 346 5 5 1"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: r5_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: r5_1}
  - screenshot: r5
  - console: "fd_bench_bmp 400 346 13 1 0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: x1nock_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: x1nock_1}
  - screenshot: x1nock
  - console: "fd_bench_bmp 0 0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: end_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: end_1}
  - screenshot: end
expect:
  no_crash: true
  log_errors: 0

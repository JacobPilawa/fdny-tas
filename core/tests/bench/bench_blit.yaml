name: bench_blit
# In-frame text investigation: cost of geEngine_DrawBitmap blits by count and area
# (engine font bitmap as the source). Debug fd_bench_blit. Not in the suite.
pre_files:
  - {src: tests/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: true
steps:
  - console: "fd_watermark 0"
  - console: "fd_bench_blit 0"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: base_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: base_1}
  - screenshot: base
  - console: "fd_bench_blit 1 8 8"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: b1_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: b1_1}
  - screenshot: b1
  - console: "fd_bench_blit 40 8 8"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: b40_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: b40_1}
  - screenshot: b40
  - console: "fd_bench_blit 400 8 8"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: b400_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: b400_1}
  - screenshot: b400
  - console: "fd_bench_blit 2000 8 8"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: b2000_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: b2000_1}
  - screenshot: b2000
  - console: "fd_bench_blit 40 64 64"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: b40x64_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: b40x64_1}
  - screenshot: b40x64
  - console: "fd_bench_blit 40 128 128"
  - wait_s: 2
  - sample_pipe: {cmd: stats, as: b40x128_0}
  - wait_s: 6
  - sample_pipe: {cmd: stats, as: b40x128_1}
  - screenshot: b40x128
  - console: "fd_bench_blit 0"
expect:
  no_crash: true
  log_errors: 0

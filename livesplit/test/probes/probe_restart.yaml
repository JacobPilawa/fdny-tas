name: lsprobe_restart
# Probe (not a case): what RESTART on the Esc briefing reloads, from oil rig B (after a
# stage exit), and what gameState / pendingMap do.
asl: FDNY_ILs.asl
duration_s: 150
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: "../live split/test/saves/next_oil_rig_a.rb", dst: Saves/player1.rb}
record: false
steps:
  - wait_s: 4
  - click: [320, 240]
  - wait_s: 3
  - gclick: [97, 457]
  - wait_s: 3
  - gclick: [195, 165]
  - wait_s: 3
  - gclick: [568, 450]
  - wait_s: 25
  - console: "fd_dbg_setpos -754 800 416 45"
  - wait_s: 12
  - screenshot: stage_b
  - focus: {}
  - key: esc
  - wait_s: 3
  - gclick: [445, 450]      # RESTART
  - wait_s: 25
  - screenshot: restarted
expect:
  no_crash: true

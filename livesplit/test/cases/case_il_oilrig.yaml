name: ls_il_oilrig
# IL splitter, staged level started from the menu, with a restart: oil rig.
#   A -> B on the exit touch (pendingMap becomes oil_rig_B);
#   Esc, RESTART: the game goes to the menu (gameState 0: the IL splitter resets) and
#   reloads the mission at A. pendingMap still reads oil_rig_B, so the second A -> B can
#   only split on the fallback, the load start;
#   B -> C, C -> D on their exit touches; D won (no exit trigger: the game's dev win key
#   F8 = UpdateZonesAndWin, needs the dev cfg); results -> menu: reset.
# events.py opens each stage's exit 3 s into play; the player is then put in the exit.
asl: FDNY_ILs.asl
splits: 5
reset: true
duration_s: 220
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: "../livesplit/test/saves/next_oil_rig_a.rb", dst: Saves/player1.rb}
record: false
steps:
  - wait_s: 4
  - click: [320, 240]       # splash: any LMB
  - wait_s: 3
  - gclick: [97, 457]       # main: "game"
  - wait_s: 3
  - gclick: [195, 165]      # career: Hotrod Stein (next: oil rig)
  - wait_s: 3
  - gclick: [568, 450]      # briefing: GO!
  - wait_s: 25              # level load + the exit opening
  - console: "fd_dbg_setpos -754 800 416 45"    # A exit
  - wait_s: 12
  - screenshot: stage_b
  - focus: {}
  - key: esc                # Esc briefing
  - wait_s: 3
  - gclick: [445, 450]      # RESTART: back to A
  - wait_s: 25
  - screenshot: restarted_a
  - console: "fd_dbg_setpos -754 800 416 45"    # A exit again (fallback split)
  - wait_s: 12
  - console: "fd_dbg_setpos 476 800 276 0"      # B exit
  - wait_s: 12
  - console: "fd_dbg_setpos 1164 780 -1474 0"   # C exit
  - wait_s: 12
  - screenshot: stage_d
  - focus: {}
  - key: {key: f8, hold: 0.2}                   # D won
  - wait_s: 15
  - screenshot: results
expect:
  no_crash: true

name: ls_rescue_bank_boat
# rescue% splitter: the same save as the IL bank case, two missions in a row through the
# career, the way a rescue% run goes. Bank won (exit) -> results -> "go!" -> briefing ->
# GO! -> boat A -> B (exit touch) -> boat B won (final exit) -> results.
# The results screens and briefings are menus (gameState 0): rescue% must not reset, and
# must keep Game Time paused from each win until the next level is playing.
asl: FDNY_rescue%.asl
splits: 3
reset: false
duration_s: 170
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: "../livesplit/test/saves/next_bank.rb", dst: Saves/player1.rb}
record: false
steps:
  - wait_s: 4
  - click: [320, 240]       # splash: any LMB
  - wait_s: 3
  - gclick: [97, 457]       # main: "game"
  - wait_s: 3
  - gclick: [195, 165]      # career: Hotrod Stein (next: bank)
  - wait_s: 3
  - gclick: [568, 450]      # briefing: GO!
  - wait_s: 25              # level load + the exit opening
  - console: "fd_dbg_setpos -680 0 1361 0"      # bank exit: won
  - wait_s: 12
  - screenshot: bank_results
  - gclick: [565, 455]      # results: go!
  - wait_s: 3
  - screenshot: boat_briefing
  - gclick: [568, 450]      # briefing: GO!
  - wait_s: 25
  - console: "fd_dbg_setpos 914 -150 8680 0"    # boat A exit
  - wait_s: 12
  - console: "fd_dbg_setpos -1195 500 3375 0"   # boat B final exit: won
  - wait_s: 12
  - screenshot: boat_results
expect:
  no_crash: true

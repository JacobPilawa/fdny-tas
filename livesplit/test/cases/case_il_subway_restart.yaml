name: ls_il_subway_restart
# IL splitter, the order case (owner 2026-10-24: "a detection method that's delicate based
# on level order played isn't very good"). Subway A from the menu -> exit -> B; Esc,
# RESTART (the menu, then A again): pendingMap still reads subway_b from the first exit, so
# the second A exit writes the same name again and nothing changes on the touch. v2.1 split
# that one late (the fallback, at the load start); v2.2 must split on the touch (the
# level-change request byte 0 -> 1) both times. Then B won (F8, dev cfg); results: reset.
asl: FDNY_ILs.asl
splits: 3
reset: true
duration_s: 190
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: "../livesplit/test/saves/next_subway_a.rb", dst: Saves/player1.rb}
record: false
steps:
  - wait_s: 4
  - click: [320, 240]       # splash: any LMB
  - wait_s: 3
  - gclick: [97, 457]       # main: "game"
  - wait_s: 3
  - gclick: [195, 165]      # career: Hotrod Stein (next: subway)
  - wait_s: 3
  - gclick: [568, 450]      # briefing: GO!
  - wait_s: 25              # level load + the exit opening
  - console: "fd_dbg_setpos 2215 -475 -5114 0"  # A exit: split 1 on the touch
  - wait_s: 12
  - screenshot: stage_b
  - focus: {}
  - key: esc                # Esc briefing
  - wait_s: 3
  - gclick: [445, 450]      # RESTART: the menu (reset), then A again
  - wait_s: 25
  - screenshot: restarted_a
  - console: "fd_dbg_setpos 2215 -475 -5114 0"  # A exit again, subway_b already pending: split 2 on the touch
  - wait_s: 12
  - focus: {}
  - key: {key: f8, hold: 0.2}                   # B won: split 3
  - wait_s: 15
  - screenshot: results
expect:
  no_crash: true

; FDNYHLMove.ini  --  live-tunable movement values.
; Put next to FDNYHLMove.asi / dinput8.dll.  Press  \  in-game to reload.
;
; Any key you delete or comment out falls back to its derived default.
; "scale" is the master knob: FDNY's world is ~1.6x bigger than Half-Life's
; (player hull 115u vs 72u), so every distance/speed = HL_default * scale.
; Rates (friction / accelerate / airaccelerate) and jump_apex are NOT scaled.

[movement]

; master scale (drives every derived default below)
scale         = 1.60

; --- overrides (uncomment to pin a value independent of scale) ---
;gravity       = 1280      ; HL 800  * scale
;maxspeed      = 512       ; HL 320  * scale   (ground run cap)
;movespeed     = 640       ; HL 400  * scale   (cl_forwardspeed / cl_sidespeed)
;stopspeed     = 160       ; HL 100  * scale   (speed below which friction is harsher)
;aircap        = 48        ; HL 30   * scale   (air-strafe wishspeed cap -- raise = faster bhop gain)
;stepsize      = 29        ; HL 18   * scale   (max ledge you walk up)
;maxvelocity   = 3200      ; HL 2000 * scale

; jump apex in FDNY units (NOT scaled -- FDNY's own jump clears ~76u, 80u max).
; impulse is derived: v = sqrt(2 * gravity * jump_apex)
jump_apex     = 76

; rates -- unscaled HL values (dimensionless, per-second)
friction      = 4
accelerate    = 10
airaccelerate = 10

; physics substep rate (Hz).  Substeps adapt to framerate to hold this.
tickrate      = 100

; 1 = hold jump to bunnyhop (autohop).  0 = must release + repress each jump.
autohop       = 1

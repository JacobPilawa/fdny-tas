# Builds FDNYCore.asi (Release) from source with the same toolchain as the VM, and
# publishes it as a GitHub release tagged v<core/VERSION>.
#   - push to main / fdny-bxt that changes core/VERSION, or a manual run:
#     build, then release v<VERSION> unless that tag already exists (never overwritten);
#   - push to any other branch (e.g. workflow-release): build only, uploaded as an
#     artifact, no tag or release.
# The build is core/build.ps1: arch_check, the address table, -Werror, the key sheet.
# Zig comes from environment/scripts/get_zig.ps1 + install_zig.ps1 (version pinned in
# environment/config.ps1); Python only needs its standard library here.
name: release

on:
  push:
    branches: [main, fdny-bxt, workflow-release]
    paths:
      - core/VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content core/VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$') { throw "core/VERSION is not a version: '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Zig version (from environment/config.ps1)
        id: zig
        shell: pwsh
        run: |
          . ./environment/config.ps1
          "version=$ZigVersion" >> $env:GITHUB_OUTPUT

      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            environment/local/downloads
            environment/local/tools/zig
          key: zig-${{ steps.zig.outputs.version }}

      - name: Install Zig
        shell: pwsh
        run: |
          if (Get-ChildItem environment/local/tools/zig -Recurse -Filter zig.exe -ErrorAction SilentlyContinue) {
            Write-Host "Zig ${{ steps.zig.outputs.version }} restored from the cache"
          } else {
            ./environment/scripts/get_zig.ps1
            ./environment/scripts/install_zig.ps1
          }

      - name: Build (Release)
        shell: pwsh
        run: ./core/build.ps1 -Config Release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $out = 'release-out'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item core/build/Release/FDNYCore.asi $out/
          Copy-Item core/build/Release/README.md $out/FDNYCore-README.md
          $sha = (Get-FileHash $out/FDNYCore.asi -Algorithm SHA256).Hash.ToLower()
          "$sha  FDNYCore.asi" | Out-File -Encoding ascii $out/FDNYCore.asi.sha256
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "FDNYCore.asi $((Get-Item $out/FDNYCore.asi).Length) bytes, sha256 $sha"

      - uses: actions/upload-artifact@v4
        with:
          name: FDNYCore-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: release-out/

      - name: Release v${{ steps.version.outputs.version }}
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fdny-bxt'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already released: nothing to do"; exit 0 }
          $notes = @"
          FDNYCore ${{ steps.version.outputs.version }}, built from ${{ github.sha }} (${{ github.ref_name }}).

          Install: copy ``FDNYCore.asi`` next to ``FDNYFirefighter.exe`` (it loads through Ultimate ASI Loader).
          ``FDNYCore-README.md`` is the key sheet for this build: every key, feature, variable and command.
          Release notes: ``dist/CHANGES.md`` in the repository.

          SHA-256: ``${{ steps.package.outputs.sha }}``
          "@
          gh release create $tag release-out/FDNYCore.asi release-out/FDNYCore-README.md release-out/FDNYCore.asi.sha256 `
            --target ${{ github.sha }} --title "FDNYCore ${{ steps.version.outputs.version }}" --notes $notes

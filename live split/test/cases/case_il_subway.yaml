name: ls_il_subway
# IL splitter, staged level started from the menu: subway. A -> B on the exit touch
# (FinalExit box); B won (no exit trigger: the game's dev win key F8 =
# UpdateZonesAndWin, needs the dev cfg); results -> menu: reset.
asl: FDNY_ILs.asl
splits: 2
reset: true
duration_s: 130
pre_files:
  - {src: tests/data/game_cfg_dev.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
  - {src: "../live split/test/saves/next_subway_a.rb", dst: Saves/player1.rb}
record: false
steps:
  - wait_s: 4
  - click: [320, 240]       # splash: any LMB
  - wait_s: 3
  - gclick: [97, 457]       # main: "game"
  - wait_s: 3
  - gclick: [195, 165]      # career: Hotrod Stein (next: subway)
  - wait_s: 3
  - gclick: [568, 450]      # briefing: GO!
  - wait_s: 25              # level load + the exit opening
  - console: "fd_dbg_setpos 2215 -475 -5114 0"  # A exit
  - wait_s: 12
  - screenshot: stage_b
  - focus: {}
  - key: {key: f8, hold: 0.2}                   # B won
  - wait_s: 15
  - screenshot: results
expect:
  no_crash: true

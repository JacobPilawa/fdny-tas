name: addr_bad_signature
# Item 2: a table entry whose signature doesn't match the running exe is
# marked bad, every module that needs it is disabled, and the game runs on.
# (Debug override table = the real one with game.map_name's signature bytes
# corrupted; the exe is never edited.)
pre_files:
  - {src: tests/game/data/addr_override_badsig.txt, dst: FDNYCore.addroverride.txt}
setup: load_training
record: true
steps:
  - assert_log: {contains: "address table: Debug override loaded"}
  - assert_log: {contains: "[WARN] signature mismatch: game.map_name"}
  - assert_log: {contains: "module levelwatch: disabled (needs game.map_name)"}
  - assert_mem: {name: game.state, equals: 1}
  - assert_screen_nonblack: in_level
expect:
  no_crash: true
  log_errors: 0

name: replay_straight
# A straight 700-unit recording from just behind the mbase spawn, along the view: the line
# starts behind the eye (cut at the near plane) and ends far away (docs/evidence/replay_depth).
pre_files:
  - {src: tests/game/data/game_cfg_player.cfg, dst: FDNYFireFighter.cfg}
  - {src: null, dst: FDNYCore.cfg}
setup: load_training
record: false
steps:
  - loadmap: mbase
  - console: "fd_replay_clear"
  - console: "fd_replay_load {repo}/docs/evidence/replay_depth/mbase_straight.jsonl"
  - console: "fd_replay_speed 64"
  - focus: {}
  - key: {key: v, hold: 0.1}
  - wait_s: 2
  - screenshot: straight
  - mouse_rel: [0, 150]
  - wait_s: 0.7
  - screenshot: straight_down
  - pipe: replay
expect:
  no_crash: true
  log_errors: 0